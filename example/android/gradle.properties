# 1536M 在 Jetifier 转换 Flutter engine jar 时会 OOM（Java heap space），故提高。
org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
# 原先此处硬编码 org.gradle.java.home 指向本机 JDK 11，已移除：
# 1) AGP 8 要求 JDK 17+，该值会直接导致构建失败；
# 2) 它是机器特有的绝对路径，对其他开发者与 CI 均不成立。
# 现由 Flutter 决定 JDK（依次取 Android Studio 内置 JDK、JAVA_HOME），
# 如需覆盖请用 `flutter config --jdk-dir=<path>`，不要写回本文件。
