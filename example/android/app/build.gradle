// 迁移自 legacy 的 `apply plugin` + `apply from: flutter.gradle` 写法，
// 改用 declarative plugins block（Flutter 3.29+ 要求）。
plugins {
    id "com.android.application"
    id "kotlin-android"
    // flutter-gradle-plugin 必须在 Android 与 Kotlin 插件之后
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    // AGP 8 要求显式声明 namespace（原先由 AndroidManifest 的 package 属性提供）。
    // 必须与 AndroidManifest 原 package 值及 MainActivity 的包名一致，
    // 否则 manifest 中 ".MainActivity" 的相对引用与 R 类包名都会解析错误。
    // 注意它与 applicationId(com.tencent.cos_flutter_example) 故意不同，保持原样。
    namespace "com.tencent.cos_example"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    // Java 与 Kotlin 的 JVM target 必须一致，否则 Kotlin 2.x 会报
    // "Inconsistent JVM-target compatibility"（Java 1.8 vs Kotlin 21）。
    // 该问题在只编 Java 时不会暴露，引入 Kotlin 编译任务（如集成测试）后才出现。
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.tencent.cos_flutter_example"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.tencentcloudapi.cls:tencentcloud-cls-sdk-android:1.0.5'
    implementation 'com.google.guava:guava:27.0.1-android'

}

flutter {
    source '../..'
}
